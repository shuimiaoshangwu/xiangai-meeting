<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2022年“湘艾湘知”优化治疗系列网络会</title>
<!--
  ══════════════════════════════════════════════════════
  布局：上半屏 = 直播黑框（全宽满铺）｜下半屏 = 背景图满铺
  ★ 换背景图：直接替换 images/bg.jpg（保持文件名不变）
  ══════════════════════════════════════════════════════
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff; background: #000;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* ── 上半屏：直播黑框，全宽满铺 ── */
  .player {
    position: relative; width: 100%; height: 50vh; height: 50dvh;
    background: #000; overflow: hidden; flex: none;
  }
  .playbtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-58%);
    width: 74px; height: 74px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.55);
    background: rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center;
  }
  .playbtn::after {
    content: ""; margin-left: 5px;
    border-left: 24px solid rgba(255,255,255,.9);
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
  }
  .playbtn-sub { position: absolute; top: calc(50% + 42px); left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .28em; text-indent: .28em; opacity: .55; }

  .live-tag {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; letter-spacing: .1em; color: #eaeaea;
    padding: 4px 10px; border-radius: 4px;
    background: rgba(30,30,30,.78); border: 1px solid rgba(255,255,255,.18);
  }
  .live-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; }

  .viewers {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: #eaeaea;
    padding: 4px 10px; border-radius: 4px;
    background: rgba(30,30,30,.78); border: 1px solid rgba(255,255,255,.18);
  }
  .viewers .ico { opacity: .85; }

  .controlbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  .progress { height: 3px; border-radius: 2px; background: rgba(255,255,255,.22); position: relative; }
  .progress::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
    border-radius: 2px; background: rgba(255,255,255,.65); }
  .times { display: flex; justify-content: space-between; font-size: 10.5px; opacity: .65; margin-top: 6px;
    font-variant-numeric: tabular-nums; }

  /* ── 下半屏：背景图满铺 ── */
  .lower {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    background: #fff url('images/bg.jpg') center / cover no-repeat;
  }
  /* 底部渐变保证文字可读 */
  .lower::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
    background: linear-gradient(transparent, rgba(6,12,32,.72));
    pointer-events: none;
  }

  /* 会议信息叠在图片下半部 */
  .info {
    position: absolute; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 2; text-align: center; padding: 0 22px;
  }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    margin-bottom: 12px; padding: 6px 18px;
    font-size: 13.5px; letter-spacing: .28em; text-indent: .28em; color: #ffd98a;
    border: 1px solid rgba(255,217,138,.55); border-radius: 4px;
    background: rgba(120,90,30,.45);
  }
  h1 { font-size: 21px; line-height: 1.4; font-weight: 700; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  .date { margin-top: 8px; font-size: 14px; opacity: .92; letter-spacing: .05em;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .date em { font-style: normal; opacity: .8; }

  @media (min-width: 700px) { h1 { font-size: 26px; } }
</style>
</head>
<body>

  <!-- 上半屏：直播黑框 -->
  <div class="player">
    <div class="playbtn"></div>
    <div class="playbtn-sub">回 放</div>

    <div class="live-tag"><span class="dot"></span>直播已结束</div>

    <div class="viewers"><span class="ico">👥</span>参会 17 人次</div>

    <div class="controlbar">
      <div class="progress"></div>
      <div class="times"><span>00:00</span><span>02:00:00</span></div>
    </div>
  </div>

  <!-- 下半屏：图片满铺 + 会议信息 -->
  <div class="lower">
    <div class="info">
      <div class="status">该会议已结束</div>
      <h1>2022年“湘艾湘知”优化治疗系列网络会</h1>
      <p class="date"><em>📅</em>2022年3月11日</p>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2022年“湘艾湘知”优化治疗系列网络会</title>
<!--
  ══════════════════════════════════════════════════════
  ★ 换背景图：直接替换 images/bg.jpg 这个文件（保持文件名不变）
  ★ 会议信息修改处：搜索【占位】逐项替换
  ══════════════════════════════════════════════════════
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff; min-height: 100vh;
    background: #0b173d url('images/bg.jpg') no-repeat center top / cover fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(rgba(6,12,32,.5), rgba(6,12,32,.38) 40%, rgba(6,12,32,.66));
  }

  .wrap { position: relative; z-index: 2; max-width: 620px; margin: 0 auto; padding: 44px 22px calc(48px + env(safe-area-inset-bottom)); }

  /* ── 直播回放黑框 ── */
  .player {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: #000; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  /* 中央回放按钮 */
  .playbtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-58%);
    width: 74px; height: 74px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.55);
    background: rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center;
  }
  .playbtn::after {
    content: ""; margin-left: 5px;
    border-left: 24px solid rgba(255,255,255,.9);
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
  }
  .playbtn-sub { position: absolute; top: calc(50% + 42px); left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .28em; text-indent: .28em; opacity: .55; }

  /* 框内左上：状态徽章 */
  .live-tag {
    position: absolute; top: 12px; left: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; letter-spacing: .1em; color: #eaeaea;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(30,30,30,.78); border: 1px solid rgba(255,255,255,.18);
  }
  .live-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; }

  /* 框内右上：参会人数（小字） */
  .viewers {
    position: absolute; top: 12px; right: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: #eaeaea;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(30,30,30,.78); border: 1px solid rgba(255,255,255,.18);
  }
  .viewers .ico { opacity: .85; }

  /* 框内底部：进度条 */
  .controlbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  .progress { height: 3px; border-radius: 2px; background: rgba(255,255,255,.22); position: relative; }
  .progress::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
    border-radius: 2px; background: rgba(255,255,255,.65); }
  .times { display: flex; justify-content: space-between; font-size: 10.5px; opacity: .65; margin-top: 6px;
    font-variant-numeric: tabular-nums; }

  /* ── 框下方信息 ── */
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 26px 0 16px; padding: 7px 20px;
    font-size: 14px; letter-spacing: .28em; text-indent: .28em; color: #ffd98a;
    border: 1px solid rgba(255,217,138,.55); border-radius: 4px;
    background: rgba(120,90,30,.35);
  }
  .info-block { text-align: left; }
  h1 { font-size: 25px; line-height: 1.45; font-weight: 700; text-shadow: 0 4px 24px rgba(0,0,0,.5); }
  .date { margin-top: 10px; font-size: 15px; opacity: .9; letter-spacing: .05em; display: flex; align-items: center; gap: 8px; }
  .date em { font-style: normal; opacity: .75; }

  footer { margin-top: 34px; text-align: center; font-size: 11px; opacity: .5; letter-spacing: .05em; }

  @media (min-width: 700px) { h1 { font-size: 30px; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- 直播黑框 -->
  <div class="player">
    <div class="playbtn"></div>
    <div class="playbtn-sub">回 放</div>

    <div class="live-tag"><span class="dot"></span>直播已结束</div>

    <!-- 参会人数（框内右上小字） -->
    <div class="viewers"><span class="ico">👥</span>参会 328 人次</div>

    <div class="controlbar">
      <div class="progress"></div>
      <div class="times"><span>00:00</span><span>02:00:00</span></div>
    </div>
  </div>

  <!-- 状态徽章 -->
  <div class="status">该会议已结束</div>

  <!-- 会议信息 -->
  <div class="info-block">
    <!-- 会议名称 -->
    <h1>2022年“湘艾湘知”<br>优化治疗系列网络会</h1>
    <!-- 会议时间 -->
    <p class="date"><em>📅</em>2022年3月11日</p>
  </div>

  <footer>本页面仅用于会议信息展示</footer>
</div>
</body>
</html>
